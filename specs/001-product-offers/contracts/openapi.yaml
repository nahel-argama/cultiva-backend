openapi: 3.1.0
info:
  title: Cultiva Product Offers API
  version: 1.0.0
  description: Contrato da feature de ofertas de produtos.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /v1/products/categories:
    get:
      operationId: listProducerCategories
      summary: Lista as categorias seedadas disponíveis ao produtor
      tags: [Producer Categories]
      responses:
        "200":
          description: Categorias em ordem de ID
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    minItems: 5
                    maxItems: 5
                    items:
                      $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/offers:
    get:
      operationId: listOffers
      summary: Lista ofertas conforme o perfil autenticado
      tags: [Offers]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Produtores recebem suas ofertas; varejistas recebem somente ofertas visíveis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: createProducerOffer
      summary: Cria uma oferta para o produtor autenticado
      tags: [Producer Offers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOffer"
      responses:
        "201":
          description: Oferta criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ProductSourceUnavailable"
  /v1/offers/{offer}:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    get:
      operationId: showProducerOffer
      summary: Exibe uma oferta pertencente ao produtor autenticado
      tags: [Producer Offers]
      responses:
        "200":
          description: Oferta própria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OfferNotFound"
    patch:
      operationId: updateProducerOffer
      summary: Atualiza uma oferta pertencente ao produtor autenticado
      tags: [Producer Offers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOffer"
      responses:
        "200":
          description: Oferta atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OfferNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ProductSourceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum access token
      description: O token precisa possuir a ability `access`; refresh tokens são rejeitados.
  parameters:
    OfferId:
      name: offer
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
  schemas:
    SourceProductId:
      oneOf:
        - type: string
          minLength: 1
          maxLength: 255
        - type: integer
          minimum: 0
      description: Sempre retornado e persistido como string; zeros à esquerda são preservados em entradas textuais.
    CategoryId:
      type: integer
      enum: [1, 2, 3, 4, 5]
    UnitPriceInput:
      type: string
      pattern: "^[0-9]+(?:\\.[0-9]{1,2})?$"
      description: Valor positivo em BRL, enviado como decimal textual para preservar precisão.
      examples: ["12.50"]
    OfferStatus:
      type: string
      enum: [active, inactive]
    CreateOffer:
      type: object
      additionalProperties: false
      required: [source_product_id, category_id, unit_price, total_quantity]
      properties:
        source_product_id:
          $ref: "#/components/schemas/SourceProductId"
        category_id:
          $ref: "#/components/schemas/CategoryId"
        unit_price:
          $ref: "#/components/schemas/UnitPriceInput"
        total_quantity:
          type: integer
          minimum: 0
        status:
          $ref: "#/components/schemas/OfferStatus"
      description: "producer_id e reserved_quantity são proibidos; status omitido assume inactive."
    UpdateOffer:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        source_product_id:
          $ref: "#/components/schemas/SourceProductId"
        category_id:
          $ref: "#/components/schemas/CategoryId"
        unit_price:
          $ref: "#/components/schemas/UnitPriceInput"
        total_quantity:
          type: integer
          minimum: 0
        status:
          $ref: "#/components/schemas/OfferStatus"
      description: "producer_id e reserved_quantity são proibidos. O produto é revalidado mesmo quando source_product_id não é enviado."
    Category:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/CategoryId"
        name:
          type: string
          enum: [Frutas, Legumes, Verduras, Tubérculos e raízes, Grãos e cereais]
    Offer:
      type: object
      additionalProperties: false
      required:
        - id
        - source_product_id
        - product_name
        - category
        - unit_price
        - total_quantity
        - reserved_quantity
        - available_quantity
        - status
        - is_visible
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          minimum: 1
        source_product_id:
          type: string
        product_name:
          type: string
          minLength: 1
        category:
          $ref: "#/components/schemas/Category"
        unit_price:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
          examples: ["12.50"]
        total_quantity:
          type: integer
          minimum: 0
        reserved_quantity:
          type: integer
          minimum: 0
        available_quantity:
          type: integer
          minimum: 0
        status:
          $ref: "#/components/schemas/OfferStatus"
        is_visible:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OfferResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Offer"
    OfferPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Offer"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    PaginationMeta:
      type: object
      required: [current_page, per_page, total, last_page]
      properties:
        current_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        last_page:
          type: integer
          minimum: 1
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        context:
          type: object
          additionalProperties: true
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    Unauthenticated:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Unauthenticated.
    Forbidden:
      description: Token sem ability access ou perfil incompatível
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: You do not have permission to access this resource.
    OfferNotFound:
      description: Oferta inexistente ou pertencente a outro produtor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: Entrada inválida, categoria inexistente, produto inexistente ou estoque inconsistente
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ValidationError"
              - $ref: "#/components/schemas/Error"
    ProductSourceUnavailable:
      description: Catálogo externo indisponível ou com resposta inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
