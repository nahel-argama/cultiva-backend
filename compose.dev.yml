networks:
    internal:
        driver: bridge

volumes:
    db-data:
    redis-data:

services:
    php:
        container_name: php
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - ./src:/var/www/html
        depends_on:
            - database
        networks:
            - internal

    nginx:
        image: nginx:stable-alpine
        container_name: nginx
        ports:
            - "80:80"
        volumes:
            - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - internal
        depends_on:
            - php

    database:
        image: postgres:18
        container_name: postgres
        ports:
            - "5432:5432"
        volumes:
            - db-data:/var/lib/postgresql
        environment:
            - POSTGRES_DB=app
            - POSTGRES_USER=root
            - POSTGRES_PASSWORD=root
        networks:
            - internal
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "root", "-d", "app"]
            interval: 1m30s
            timeout: 30s
            retries: 5
            start_period: 30s

    redis:
        image: redis:8-alpine
        container_name: redis
        command: redis-server --requirepass ${REDIS_PASSWORD}
        volumes:
            - redis-data:/data
        networks:
            - internal

    worker:
        container_name: worker
        build:
            context: .
            dockerfile: Dockerfile
        entrypoint: []
        command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
        volumes:
            - ./src:/var/www/html
        depends_on:
            - database
            - redis
        networks:
            - internal
