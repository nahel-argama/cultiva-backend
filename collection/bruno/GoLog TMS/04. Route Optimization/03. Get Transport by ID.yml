info:
  name: Get Transport by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{golog_base_url}}/transport/:id"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: id
      value: "{{golog_transport_id}}"
      type: path
  auth:
    type: bearer
    token: "{{golog_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
