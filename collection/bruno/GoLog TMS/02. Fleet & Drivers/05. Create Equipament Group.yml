info:
  name: Create Equipament Group
  type: http
  seq: 5

http:
  method: POST
  url: "{{golog_base_url}}/equipament-group"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{golog_token}}"
  body:
    type: json
    data: |
      {
        "equipament1Id": "{{golog_equipament_id}}",
        "observation": "Conjunto operacional motorista Cultiva"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const body = res.getBody();
          if (body.id) {
            bru.setEnvVar('golog_equipament_group_id', body.id, { persist: true });
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
