info:
  name: Associate Transport Type
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{golog_base_url}}/equipament-group/association"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{golog_token}}"
  body:
    type: json
    data: |
      {
        "groupId": "{{golog_equipament_group_id}}",
        "typeId": "{{type_transport_id}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
