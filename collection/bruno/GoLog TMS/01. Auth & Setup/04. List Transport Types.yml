info:
  name: List Transport Types
  type: http
  seq: 4

http:
  method: GET
  url: "{{golog_base_url}}/type-transport"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{golog_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
