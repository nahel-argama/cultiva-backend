info:
  name: Get Demand Types by Company
  type: http
  seq: 2

http:
  method: GET
  url: "{{golog_base_url}}/demand-type/company/:companyId"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: companyId
      value: "{{golog_company_id}}"
      type: path
  auth:
    type: bearer
    token: "{{golog_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
