info:
  name: Create Shipment (Pickup - Coleta)
  type: http
  seq: 3

http:
  method: POST
  url: "{{golog_base_url}}/shipment"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{golog_token}}"
  body:
    type: json
    data: |
      {
        "typeOperation": "COLETA",
        "weight": 50.0,
        "volume": 0.5,
        "schedulind": "2026-11-02T08:00:00Z",
        "status": "PENDENTE",
        "userId": "{{golog_user_id}}",
        "shipmentTypeId": "{{shipment_type_id}}",
        "typeTransportId": "{{type_transport_id}}",
        "addressId": "{{producer_address_id}}",
        "customerId": "{{producer_company_id}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const body = res.getBody();
          if (body.id) {
            bru.setEnvVar('golog_pickup_shipment_id', body.id, { persist: true });
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
