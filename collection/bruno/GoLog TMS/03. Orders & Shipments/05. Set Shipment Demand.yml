info:
  name: Set Shipment Demand
  type: http
  seq: 5

http:
  method: POST
  url: "{{golog_base_url}}/shipment-demand/shipment/:shipmentId"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: shipmentId
      value: "{{golog_dropoff_shipment_id}}"
      type: path
  auth:
    type: bearer
    token: "{{golog_token}}"
  body:
    type: json
    data: |
      [
        {
          "demandTypeId": "{{demand_type_id}}",
          "amount": 50.0
        }
      ]

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
