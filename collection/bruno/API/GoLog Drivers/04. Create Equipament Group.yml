info:
  name: 04. Create Equipament Group
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/v1/golog/equipament-groups"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{access_token}}"
  body:
    type: json
    data: |
      {
        "observation": "Conjunto padrão motorista"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          const body = res.getBody();
          bru.setEnvVar('golog_equipament_group_id', body.data.vehicle.golog_equipament_group_id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
