info:
  name: 02. Create Driver
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/v1/golog/drivers"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{access_token}}"
  body:
    type: json
    data: |
      {
        "cnh_number": "12345678901",
        "cnh_expiration": "2028-12-31",
        "cost_per_hour": 45.0
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          const body = res.getBody();
          bru.setEnvVar('golog_driver_id', body.data.golog_driver_id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
