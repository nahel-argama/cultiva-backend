info:
  name: 01. Create User
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/v1/golog/users"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "user": {
          "name": "Gabriel Vieira Entregas",
          "email": "gabriel.vieira@cultiva.com",
          "password": "Password123!",
          "password_confirmation": "Password123!",
          "cpf": "81639472096"
        },
        "company": {
          "trade_name": "Vieira Cargo Sul",
          "legal_name": "Vieira Transportes Rodoviarios LTDA",
          "document_number": "63829147000109",
          "phone": "47991234567",
          "address": {
            "zip": "89010025",
            "number": "410",
            "complement": "Sala 2",
            "reference_point": "Centro"
          }
        }
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          const body = res.getBody();
          bru.setEnvVar('access_token', body.data.tokens.access_token, { persist: true });
          bru.setEnvVar('golog_driver_user_id', body.data.profile.golog_user_id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
