info:
  name: 01. Create User
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/v1/golog/users"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "user": {
          "name": "Rafael Santos Motorista",
          "email": "rafael.golog@example.com",
          "password": "Password123!",
          "password_confirmation": "Password123!",
          "cpf": "40374708029"
        },
        "company": {
          "trade_name": "Santos Log Express",
          "legal_name": "Santos Transportes LTDA",
          "document_number": "12345678000195",
          "phone": "11987654321",
          "address": {
            "zip": "89010025",
            "number": "789",
            "complement": "Galpão B",
            "reference_point": "Próximo à rodovia"
          }
        }
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          const body = res.getBody();
          bru.setEnvVar('access_token', body.data.tokens.access_token, { persist: true });
          bru.setEnvVar('golog_driver_user_id', body.data.profile.golog_user_id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
