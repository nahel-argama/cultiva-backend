info:
  name: 03. Create Vehicle
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/v1/golog/vehicles"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{access_token}}"
  body:
    type: json
    data: |
      {
        "plate": "VRA8C55",
        "capacity": 1800.0,
        "renavam": "84920173654",
        "model": "Iveco Daily 35-150",
        "number_axles": 2,
        "type_fuel": "DIESEL",
        "cost_per_kilometer": 2.8
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          const body = res.getBody();
          bru.setEnvVar('golog_equipament_id', body.data.vehicle.golog_tractor_id, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
