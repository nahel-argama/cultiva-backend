info:
  name: Wishlist Analytics
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/v1/wishlist/analytics?state={{state}}&limit={{limit}}"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
