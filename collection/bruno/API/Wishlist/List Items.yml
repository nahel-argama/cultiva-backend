info:
  name: List Wishlist Items
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/wishlist/items?page={{page}}&per_page={{per_page}}&search={{search}}"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
