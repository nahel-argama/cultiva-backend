info:
  name: Assign Trip
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/v1/delivery/trips/:trip/assign"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: trip
      value: "1"
      type: path
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
