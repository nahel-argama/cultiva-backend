info:
  name: List My Purchases
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/purchases?page={{page}}&per_page={{per_page}}"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: page
      value: "{{page}}"
      type: query
    - name: per_page
      value: "{{per_page}}"
      type: query
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  variables:
    - name: page
      value: "1"
    - name: per_page
      value: "10"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
