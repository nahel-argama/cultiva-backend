info:
  name: Show Offer
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/v1/offers/:offer_id"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: offer_id
      value: "1"
      type: path
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
