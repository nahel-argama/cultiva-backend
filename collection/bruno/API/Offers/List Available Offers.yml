info:
  name: List Available Offers
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/v1/offers?page=1&per_page=15"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "15"
      type: query
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
