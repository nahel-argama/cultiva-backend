info:
  name: List Categories
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/products/categories"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{producer_access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
