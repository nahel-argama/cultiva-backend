info:
  name: Update Offer
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}/v1/offers/:offer_id"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  params:
    - name: offer_id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "category_id": 1,
        "unit_price": "15.00",
        "total_quantity": 25
      }
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
