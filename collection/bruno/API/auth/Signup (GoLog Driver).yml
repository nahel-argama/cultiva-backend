info:
  name: Signup (GoLog Driver)
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/v1/auth/signup"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "user": {
          "name": "Rafael Santos Motorista",
          "email": "rafael.golog@example.com",
          "password": "Password123!",
          "password_confirmation": "Password123!"
        },
        "profile_type": "golog_driver",
        "company": {
          "trade_name": "Santos Log Express",
          "legal_name": "Santos Transportes LTDA",
          "document_number": "12345678000195",
          "phone": "11987654321",
          "address": {
            "zip": "89010025",
            "number": "789",
            "complement": "Galpão B",
            "reference_point": "Próximo à rodovia"
          }
        },
        "golog_driver": {
          "cpf": "12345678901",
          "cnh_number": "12345678901",
          "cnh_expiration": "2028-12-31",
          "cost_per_hour": 45.0,
          "vehicle": {
            "plate": "BRA2E19",
            "capacity": 1500.5,
            "renavam": "12345678901",
            "model": "Mercedes Sprinter",
            "number_axles": 2,
            "type_fuel": "DIESEL",
            "cost_per_kilometer": 2.5
          }
        }
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          const body = res.getBody();
          bru.setEnvVar('access_token', body.data.tokens.access_token, { persist: true });
          if (body.data.profile?.golog_user_id) {
            bru.setEnvVar('golog_driver_user_id', body.data.profile.golog_user_id, { persist: true });
          }
          if (body.data.profile?.golog_driver_id) {
            bru.setEnvVar('golog_driver_id', body.data.profile.golog_driver_id, { persist: true });
          }
          if (body.data.profile?.vehicle?.golog_tractor_id) {
            bru.setEnvVar('golog_equipament_id', body.data.profile.vehicle.golog_tractor_id, { persist: true });
          }
          if (body.data.profile?.vehicle?.golog_equipament_group_id) {
            bru.setEnvVar('golog_equipament_group_id', body.data.profile.vehicle.golog_equipament_group_id, { persist: true });
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
