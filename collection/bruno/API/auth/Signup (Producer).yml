info:
  name: Signup (Producer)
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/v1/auth/signup"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "user": {
          "name": "Maria Silva",
          "email": "maria@example.com",
          "password": "Password123!",
          "password_confirmation": "Password123!"
        },
        "profile_type": "producer",
        "company": {
          "trade_name": "Sítio Primavera",
          "legal_name": "Sítio Primavera LTDA",
          "document_number": "12345678000195",
          "phone": "5511987654321",
          "address": {
            "zip": "89010025",
            "number": "123",
            "complement": "Portão Azul",
            "reference_point": "Perto da ponte"
          }
        },
        "producer": {
          "activity_segment": "vegetables"
        }
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          const body = res.getBody();
          bru.setEnvVar(`${body.data.profile_type}_access_token`, body.data.tokens.access_token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
