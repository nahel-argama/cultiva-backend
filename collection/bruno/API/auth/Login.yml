info:
  name: Login
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/v1/auth/login"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "email": "maria@example.com",
        "password": "Password123!"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const body = res.getBody();
          bru.setEnvVar('access_token', body.data.tokens.access_token, { persist: true });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
