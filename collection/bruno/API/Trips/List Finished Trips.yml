info:
  name: List Finished Trips
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/v1/delivery/trips/finished?page={{page}}&per_page={{per_page}}"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
